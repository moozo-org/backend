post:
  operationId: login
  summary: Start a session
  description: >
    Exchanges an email and password for a session token. Send it as
    `Authorization: Bearer <token>` on authenticated requests. The token is
    returned only here; the server keeps just its hash.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/LoginRequest.yaml
  responses:
    '200':
      description: Session started
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Session.yaml
    '401':
      $ref: ../components/responses/Unauthorized.yaml
    '403':
      description: The email is not verified yet; see POST /auth/verify
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yaml
    default:
      $ref: ../components/responses/Error.yaml
