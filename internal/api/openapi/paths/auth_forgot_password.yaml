post:
  operationId: forgotPassword
  summary: Email a password reset code
  description: >
    Sends a six-digit code to send to POST /auth/reset-password, invalidating
    any previous one. Codes expire after 30 minutes. At most one code is sent
    per minute. The response is the same whether or not the email has an
    account, so it reveals nothing.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ForgotPasswordRequest.yaml
  responses:
    '202':
      description: A code is sent if the email has an account
    default:
      $ref: ../components/responses/Error.yaml
