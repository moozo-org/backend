post:
  operationId: resetPassword
  summary: Set a new password with an emailed code
  description: >
    Sets a new password with the code from POST /auth/forgot-password. A code
    works once and allows 5 attempts; after that, request a new one. Every
    session of the account is revoked, and a pending account is activated.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ResetPasswordRequest.yaml
  responses:
    '204':
      description: Password changed; log in with the new one
    '400':
      $ref: ../components/responses/BadRequest.yaml
    default:
      $ref: ../components/responses/Error.yaml
