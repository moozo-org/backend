type: object
required:
  - email
  - code
  - new_password
properties:
  email:
    type: string
    format: email
    maxLength: 254
    example: jane@example.com
  code:
    type: string
    pattern: '^[0-9]{6}$'
    example: '042917'
  new_password:
    type: string
    format: password
    minLength: 8
    maxLength: 72
    description: At most 72 bytes once UTF-8 encoded (bcrypt limit).
