type: object
required:
  - current_password
  - new_password
properties:
  current_password:
    type: string
    format: password
    maxLength: 72
  new_password:
    type: string
    format: password
    minLength: 8
    maxLength: 72
    description: At most 72 bytes once UTF-8 encoded (bcrypt limit). Must differ from the current password.
