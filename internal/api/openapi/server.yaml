openapi: 3.1.0
info:
  title: Moozo API
  version: 1.0.0
paths:
  /auth/register:
    $ref: "paths/auth_register.yaml"
  /auth/login:
    $ref: "paths/auth_login.yaml"
  /auth/logout:
    $ref: "paths/auth_logout.yaml"
  /auth/change-password:
    $ref: "paths/auth_change_password.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from POST /auth/login.
