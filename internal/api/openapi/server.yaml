openapi: 3.1.0
info:
  title: Moozo API
  version: 1.0.0
paths:
  /auth/register:
    $ref: "paths/auth_register.yaml"
  /auth/login:
    $ref: "paths/auth_login.yaml"
  /auth/logout:
    $ref: "paths/auth_logout.yaml"
  /auth/verify:
    $ref: "paths/auth_verify.yaml"
  /auth/resend-verification:
    $ref: "paths/auth_resend_verification.yaml"
  /auth/forgot-password:
    $ref: "paths/auth_forgot_password.yaml"
  /auth/reset-password:
    $ref: "paths/auth_reset_password.yaml"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session token from POST /auth/login.
