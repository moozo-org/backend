sonar.projectKey=moozo-org_backend
sonar.organization=moozo-org

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=backend
sonar.projectVersion=1.0

# Path is relative to this file
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/*_test.go,**/moozotest/**,node_modules/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Written by the test job in ci.yml (generated code already filtered out).
sonar.go.coverage.reportPaths=coverage.filtered.out
