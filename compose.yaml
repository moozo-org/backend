services:
  api:
    build:
      context: .
      dockerfile: cmd/Dockerfile
    container_name: moozo-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      PRODUCTION: "false"
      MONGODB_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:latest
    container_name: moozo-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
