version: "2"

linters:
  # Defaults are errcheck, govet, ineffassign, staticcheck and unused.
  enable:
    - gocyclo

  settings:
    gocyclo:
      # Functions above this cyclomatic complexity are reported.
      min-complexity: 12

  exclusions:
    paths:
      # ogen output; regenerated by `go generate ./...`, never hand-edited.
      - internal/api/generated

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - internal/api/generated
